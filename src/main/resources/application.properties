quarkus.application.name=order-service

# REST Client -> InventoryService
# Socket read-timeout is set above @Timeout (800 ms) so FT is always the one that fires;
# the socket timeout is a last-resort safety net for paths outside FT interceptors.
quarkus.rest-client.inventory-api.url=${INVENTORY_BASE_URL:http://localhost:8081}
quarkus.rest-client.inventory-api.connect-timeout=500
quarkus.rest-client.inventory-api.read-timeout=1000
quarkus.rest-client.inventory-api.connection-pool-size=50

# Fallback cache
inventory.cache.ttl=PT10M
inventory.cache.max-entries=10000

# Observability — metrics: /q/metrics | health: /q/health/ready
quarkus.micrometer.binder.http-client.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# FT overrides for the test profile — faster timeouts/delays for deterministic tests.
# Production values live in @Timeout/@Retry/@CircuitBreaker annotations (single source of truth).
%test.quarkus.http.test-port=0
%test.com.example.order.inventory.InventoryService/getProductAvailability/Timeout/value=500
%test.com.example.order.inventory.InventoryService/getProductAvailability/Retry/delay=50
%test.com.example.order.inventory.InventoryService/getProductAvailability/Retry/jitter=0
%test.com.example.order.inventory.InventoryService/getProductAvailability/CircuitBreaker/requestVolumeThreshold=4
%test.com.example.order.inventory.InventoryService/getProductAvailability/CircuitBreaker/delay=1000
%test.com.example.order.inventory.InventoryService/getProductAvailability/CircuitBreaker/successThreshold=2
